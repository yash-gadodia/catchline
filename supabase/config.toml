# Supabase configuration for Catchline (local stack).
# Ports are offset from the CLI defaults (543xx -> 554xx) so this stack can run
# next to the archived Parallax stack on the Mini without clashing.
project_id = "catchline"

[api]
enabled = true
port = 55421
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55422
shadow_port = 55420
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 55423

[inbucket]
enabled = true
port = 55424

[analytics]
enabled = false
port = 55427

[auth]
enabled = true
site_url = "catchline://"
additional_redirect_urls = ["catchline://auth-callback"]
# The app starts on an anonymous account (no sign-in screen); Apple/Google link to it later.
enable_anonymous_sign_ins = true

[auth.email]
enable_signup = true
enable_confirmations = true

[auth.email.template.confirmation]
subject = "Confirm your Catchline account"
content_path = "./supabase/templates/confirmation.html"

# Raw clips are trimmed iPhone slo-mo (often 60-150 MB). The per-bucket limit
# in 0003_storage.sql is the real gate; this is the global ceiling.
[storage]
enabled = true
file_size_limit = "500MiB"

[functions.delete-account]
verify_jwt = true

[functions.revenuecat-webhook]
verify_jwt = false

[functions.sync-plan]
verify_jwt = true

[functions.ops-alert]
verify_jwt = true

[functions.apple-token]
verify_jwt = true

[functions.intercom-hash]
verify_jwt = true
