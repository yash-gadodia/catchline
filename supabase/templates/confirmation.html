<!doctype html>
<html>
  <body style="margin:0;padding:0;background:#000000;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#000000;padding:40px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:440px;padding:36px 24px;">
            <tr>
              <td align="left" style="font-size:24px;font-weight:700;color:#ECE7DF;letter-spacing:-0.3px;padding-bottom:28px;">
                Catchline
              </td>
            </tr>
            <tr>
              <td align="left" style="font-size:20px;font-weight:700;color:#ECE7DF;line-height:28px;padding-bottom:12px;">
                Confirm your email
              </td>
            </tr>
            <tr>
              <td align="left" style="font-size:15px;color:#A39F97;line-height:23px;padding-bottom:28px;">
                Tap below to finish setting up your Catchline account.
              </td>
            </tr>
            <tr>
              <td align="left" style="padding-bottom:28px;">
                <a href="catchline://auth-callback?token_hash={{ .TokenHash }}&type=signup"
                   style="display:inline-block;background:#ECE7DF;color:#000000;text-decoration:none;font-size:16px;font-weight:700;padding:16px 24px;border-radius:4px;">
                  Confirm my email
                </a>
              </td>
            </tr>
            <tr>
              <td align="left" style="font-size:13px;color:#6E6B65;line-height:18px;border-top:1px solid #2E2E2E;padding-top:16px;">
                If you didn't create a Catchline account, you can ignore this email.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
