[project]
name = "catchline-worker"
version = "0.1.0"
description = "Catchline lift worker: pgmq job -> catchline_cv pipeline -> analysis + cue in Supabase"
requires-python = ">=3.11,<3.13"
dependencies = [
    "catchline-cv",
    "httpx>=0.27",
]

[tool.uv.sources]
catchline-cv = { path = "../cv", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["catchline_worker"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
