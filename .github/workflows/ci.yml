name: CI

on:
  push:
    branches: [catchline]
  pull_request:
    branches: [catchline]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck + tests
    runs-on: [self-hosted, catchline-mini]
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so gitleaks scans every commit.
          fetch-depth: 0
      # The repo is public: a secret in any commit is a leak, so scan the whole history every run.
      - name: Secret scan
        run: gitleaks git --no-banner --redact .
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install deps
        run: npm install --legacy-peer-deps
      - name: Typecheck
        run: npm run typecheck
      - name: Checks
        run: npm run check
      - name: Tests
        run: npm test -- --ci
