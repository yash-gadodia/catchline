name: CI

on:
  push:
    branches: [catchline]
  pull_request:
    branches: [catchline]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck + tests
    runs-on: [self-hosted, catchline-mini]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install deps
        run: npm install --legacy-peer-deps
      - name: Typecheck
        run: npm run typecheck
      - name: Checks
        run: npm run check
      - name: Tests
        run: npm test -- --ci
