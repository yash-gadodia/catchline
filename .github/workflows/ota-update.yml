name: OTA Update (EAS)

# Pushes Catchline JS/asset changes over-the-air to the "preview" channel. Manual
# only: run it from the Actions tab (or `gh workflow run ota-update.yml --ref catchline`).
# Silently no-ops until EXPO_TOKEN is set (so it never fails before you're ready).
on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Is EAS configured?
        id: gate
        env:
          TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "EXPO_TOKEN not set — skipping OTA. Add it in Settings → Secrets to enable."
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.enabled == 'true'
        with:
          ref: catchline
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.enabled == 'true'
        with:
          node-version: 20
          cache: npm
      - uses: expo/expo-github-action@v8
        if: steps.gate.outputs.enabled == 'true'
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Install deps
        if: steps.gate.outputs.enabled == 'true'
        run: npm install --legacy-peer-deps
      - name: Publish OTA update
        if: steps.gate.outputs.enabled == 'true'
        run: eas update --branch preview --message "catchline $(git rev-parse --short HEAD)" --non-interactive
