[project]
name = "catchline-cv"
version = "0.1.0"
description = "Catchline CV spike: pose + plate tracking + snatch rules -> Analysis JSON"
requires-python = ">=3.11,<3.13"
dependencies = [
    "rtmlib>=0.0.13",
    "onnxruntime>=1.18",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "scipy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["catchline_cv"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
